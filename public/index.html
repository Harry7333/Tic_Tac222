        <div class="page">
            <div class="logo" id="logo" >            
            </div>
            <div class="splash" id="splash" >            
            </div>
            <div id="main-menu" class="main-menu">
                <p id="menu-point"> Available Points: </p>
                <button id="btn-player-vs-player" class="button-style">Player vs Player</button>
                <button id="btn-player-vs-ai" class="button-style">Player vs AI</button>
                <button id="btn-multiplyer" class="button-style">Multiplayer</button>
                <button id="btn-help" class="button-style">Help</button>  
                <button id="btn-sound" class="button-style">Sound On</button>
                <button id="btn-profile" class="button-style">Profile</button>    
            </div>
            <div class="info" id="info">
                <p id="title" class="title">INFO</p>
                <p id="sub-title" class="sub-title"></p>
                <p id="text-content" class="text-content"></p>
                <div class="space"></div>
                <button id="btn-info-continue" class="button-style">Continue</button>
                <button id="btn-back" class="button-style">Back</button>    
            </div>
            <div id="profile-container">
                <section id="avatar-section">
                    <div class="avatar-row">
                        <div id="selected-avatar" ></div>
                    </div>
                    <div class="avatar-row">
                        <div id="avatar_0" class="avatar"></div>
                        <div id="avatar_1" class="avatar"></div>
                        <div id="avatar_2" class="avatar"></div>
                    </div>
                    <div class="avatar-row">
                        <div id="avatar_3" class="avatar"></div>
                        <div id="avatar_4" class="avatar"></div>
                        <div id="avatar_5" class="avatar"></div>
                    </div>    
                </section>  
                <section id="name-section">
                    <div class="input-group">
                        <label for="user-name">Name:</label>
                        <input type="text" id="user-name" maxlength="20" placeholder="Enter your name"/>
                    </div>  
                    <br>
                    <br>
                    <br>
                    <br>
                    <button id="btn-save" class="button_box">Save</button> 
                    <button id="btn-profile-continue" class="button_box">Continue</button> 
                    <button id="btn-profile-back" class="button_box">Back</button>  
                </section>  
            </div>
        </div>

        

        


        <div id="main">
            <section id="message-popup">
                <p id="message"> hello </p>
            </section>    
            <section id="hud">
                <p id="config-point"> Available Points: </p>
                <!-- <p id="titleTurns">Number of turns</p> -->
                <p id="numberTurns">Number of turns</p>
                <button id="soundonoff" ></button>
            </section>    
            <section id="startBox" class="sidebar1">
                <div class="input-group">
                    <label for="player1_name">Player 1:</label>
                    <input type="text" id="player1_name" maxlength="20" placeholder="Player 'X'"/>
                </div>
                <div class="input-group">
                    <label for="player2_name">Player 2:</label>
                    <input type="text" id="player2_name" maxlength="20" placeholder="Player 'O'"/>
                </div>
                <div class="input-group">    
                    <label for="columns">Columns:</label>
                    <input type="number" id="columns" min="3" max="20" placeholder="3 - 10"/>
                </div>    
                <div class="input-group">
                    <label for="rows">Rows:</label>
                    <input type="number" id="rows" min="3" max="20" placeholder="3 - 10"/>
                </div>    
                <div class="input-group">
                    <label for="steps">Win length: </label>
                    <input type="number" id="steps" min="3" max="20" placeholder="3 - 10"/>
                </div>
                <button id="start" class="button_box" >START</button>
                <button id="back" class="button_box" >BACK</button>
            </section>
            <section id="field">
                <p id="countdown"> </p>
            </section>
            <section id="game-play-bottom">
              <div class="avatar-on-game">
                <div id="player1Avatar" class="playerAvatar"></div>
                <div id="player2Avatar" class="playerAvatar"></div>  
              </div>  
              <div class="player-section">  
                <p id="player1" class="button_box">-</p>
                <p id="player2" class="button_box">-</p>
              </div>
              <div class="timer-section">  
                <p id="player1Timer" class="button_box">-</p>
                <p id="player2Timer" class="button_box">-</p>
              </div>  
              <!-- <div id="turns">
                <p id="titleTurns">Number of turns</p>
                <p id="numberTurns">0</p>
              </div> -->
              <div id="status"></div>
              <button id="playAgain" class="button_box">PLAY AGAIN</button>
              <button id="restart" class="button_box">BACK</button>
              <button id="home" class="button_box">HOME</button>
            </section>
        </div>
